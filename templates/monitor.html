<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <h1>Monitor Screen</h1>
    <div id="display" style="font-size: 24px; border: 1px solid #000; padding: 10px; width: 90%; margin: auto;">
        Waiting for input...
    </div>
    
    <h2>Sketch Area</h2>
    <canvas id="sketchDisplay" width="500" height="300" style="border: 1px solid black; display: block; margin: auto;"></canvas>
    
    <script>
        const socket = io();
        const displayDiv = document.getElementById("display");
        const canvas = document.getElementById("sketchDisplay");
        const ctx = canvas.getContext("2d");

        // Update text in real-time
        socket.on("update_text", (data) => {
            displayDiv.textContent = data.text;
        });

        // Update sketch in real-time
        socket.on("sketch_update", (data) => {
            ctx.fillStyle = "black";
            ctx.fillRect(data.x, data.y, 2, 2);
        });
    </script>
</body>
</html>
